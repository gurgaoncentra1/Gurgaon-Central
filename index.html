/* Layout: sticky nav + ticker, then one "page" at a time (hash routes). Sticker-style cards with hard shadows, a light teal hero, and an illustration on every place card. */

*{box-sizing:border-box}
html{scroll-behavior:smooth}

p{margin:0}
a{color:inherit}
:focus-visible{outline:3px dashed var(--coral);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header + ticker */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:3px solid var(--stroke)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-size:1.35rem;white-space:nowrap}
.brand img{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--stroke);display:block;transform:rotate(-4deg)}

.marquee{background:var(--ink);color:var(--paper);overflow:hidden;border-bottom:3px solid var(--stroke)}
.track{display:flex;width:max-content;animation:scroll 32s linear infinite}
.track span{padding:8px 20px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;white-space:nowrap}
.track .sep{letter-spacing:0;padding-left:6px;padding-right:6px}
@keyframes scroll{to{transform:translateX(-50%)}}

/* stickers & buttons */
.sticker{display:inline-block;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:3px 14px;font-weight:800;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}
.sticker.alt{background:var(--sand);transform:rotate(2deg)}
.btn{display:inline-block;padding:13px 24px;border-radius:14px;font:inherit;font-weight:800;text-decoration:none;background:var(--ink);color:var(--paper);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--coral);cursor:pointer}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--coral)}
.btn.light{background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.btn.light:hover{box-shadow:7px 7px 0 var(--ink)}

.hero{background:var(--teal);color:var(--ink);border-bottom:3px solid var(--stroke);padding-block:clamp(40px,7vw,84px);position:relative;overflow:hidden}

.section{padding-block:clamp(20px,3.4vh,40px)}
.section h2.sub{margin-bottom:clamp(10px,2vh,18px)}
.lede{margin-bottom:clamp(10px,2vh,20px)}
#map-section .lede{max-width:none}

#tip-section .tip{grid-template-columns:repeat(3,minmax(0,1fr));padding:20px;gap:12px 14px}
#tip-section .tip label:nth-of-type(4),#tip-section .tip .btn,#tip-section .tip #tip-result{grid-column:1/-1}
#tip-section .tip textarea{min-height:clamp(60px,10vh,100px)}
#tip-section .tip .btn{justify-self:start}
}
.doodle{position:absolute;pointer-events:none;color:var(--ink);opacity:.9}

/* mood picker */
.mood{padding-block:44px 8px}
.mood h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:16px}
.moods{display:flex;flex-wrap:wrap;gap:12px}
.moods a{text-decoration:none;font-weight:800;padding:10px 18px;border:3px solid var(--stroke);border-radius:99px;background:var(--surface);box-shadow:4px 4px 0 var(--shadow)}

.moods a:nth-child(3n):hover{background:var(--coral);color:var(--ink)}
.moods a:hover{transform:translate(-2px,-2px) rotate(-1deg)}

/* page hero */
.phero{background:var(--pg-bg);color:var(--pg-fg);border-bottom:3px solid var(--stroke);padding-block:clamp(36px,6vw,72px)}
.phero h1{font-size:clamp(2.8rem,9vw,6.2rem);margin:14px 0 10px}
.phero p.tagline{font-size:1.25rem;font-weight:600;max-width:40ch}
.phero .hand{font-family:var(--font-hand);font-size:1.7rem;display:inline-block;transform:rotate(-2deg);margin-top:10px}
.section{padding-block:clamp(36px,6vw,64px)}
.section h2.sub{font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:22px}
.lede{font-size:1.1rem;color:var(--muted);max-width:58ch;margin-bottom:26px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:26px}
.card{display:flex;flex-direction:column;background:var(--surface);border:3px solid var(--stroke);border-radius:22px;box-shadow:7px 7px 0 var(--pagec,var(--shadow));overflow:hidden;min-width:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px) rotate(-.4deg);box-shadow:10px 10px 0 var(--pagec,var(--shadow))}
.card .pic{border-bottom:3px solid var(--stroke);aspect-ratio:400/260;background:var(--chip);position:relative;overflow:hidden}
.card .pic svg{display:block;width:100%;height:100%}

.pic.poster{aspect-ratio:16/9}

.card .body{display:flex;flex-direction:column;gap:10px;padding:18px 20px 20px;flex:1}

.row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

function phero(r){return '<section class="phero" style="--pg-bg:'+r.bg+';--pg-fg:'+r.fg+'"><div class="wrap"><span class="sticker">'+r.eyebrow+' of 10</span><h1>'+r.title+'</h1><p class="tagline">'+r.tag+'</p><span class="hand">'+r.hand+'</span>'+stk(r.stk[0],'deco d1 bob','right:2%;top:-4px;--s:120px;--r:10deg')+stk(r.stk[1],'deco d2','right:170px;bottom:-18px;--s:84px;--r:-12deg')+'</div></section>'}
function pager(id){var i=ROUTES.findIndex(function(x){return x.id===id}),n=ROUTES[(i+1)%ROUTES.length];return '<div class="pager"><a class="btn light" href="#home">← Home</a><a class="btn" href="#'+n.id+'">Next: '+n.label+' →</a></div>'}
function page(id,inner){var r=ROUTES.find(function(x){return x.id===id});return phero(r)+'<div class="wrap section">'+inner+pager(id)+'</div>'}

  if(k&&S.skip.indexOf(k)<0)S.skip.push(k);var mm={shop:'shop',culture:'culture',nature:'nature',activity:'activity',event:'events'}[k];S.moods=S.moods.filter(function(x){return x!==mm});any=true}
 if(has(/\b(solo|alone|by myself)\b/)){S.who='solo';any=true}else if(has(/\b(friends|friend|group|gang|squad)\b/)){S.who='friends';any=true}else if(has(/\b(date|partner|couple|girlfriend|boyfriend|romantic)\b/)){S.who='date';any=true}else if(has(/\b(family|kids|kid|child|children|parents|mom|dad)\b/)){S.who='family';any=true}

 else{var wk={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6},hit=null;Object.keys(wk).forEach(function(n){if(has(new RegExp('\\b'+n+'\\b')))hit=wk[n]});
